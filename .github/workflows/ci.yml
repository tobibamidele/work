name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: work, POSTGRES_PASSWORD: work, POSTGRES_DB: work_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U work" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env: { MYSQL_USER: work, MYSQL_PASSWORD: work, MYSQL_DATABASE: work_test, MYSQL_ROOT_PASSWORD: root }
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - run: make lint
      - run: make test
      - run: make integration
      - run: make examples
